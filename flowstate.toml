# Flowstate configuration — operational truth → twin → optimizer

[scheduler]
planning_start_date = "2026-02-15 00:00:00"
horizon_hours = 336
time_limit = 60
min_run_hours = 4
max_lines_per_order = 2
validate = true
use_sku_rates = false

[cip]
interval_h = 120
duration_h = 6

[objective]
makespan_weight = 6
changeover_weight = 120
cip_defer_weight = 5
# Soft due-date penalty per hour an order finishes late (relax ladder level 2+).
late_weight = 200
co_conv_org_weight = 30
co_cinn_weight = 20
co_flavor_weight = 5

[changeover]
