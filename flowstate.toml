# Flowstate configuration — operational truth → twin → optimizer

[scheduler]
planning_start_date = "2026-08-31 00:00:00"
# Rolling horizon (handoff WW32 #1). "today" = the Plant Calendar opens on the
# current day and offers to re-base stored blocks onto it; "fixed" keeps the
# legacy behaviour of always opening on planning_start_date.
anchor_mode = "today"
horizon_weeks = 3
horizon_hours = 504
time_limit = 60
min_run_hours = 4
max_lines_per_order = 2
validate = true
use_sku_rates = false
# Scenario E: current-state MOs (manprg running + queued) become solver
# orders locked to their line; the availability gate is the running MO's end
# and mo_changes.csv records every split/trim/reorder for VIF write-back.
use_current_mo = true
# Re-forecast a RUNNING MO's end from its ACTUAL observed rate (cases made /
# hours since start) instead of trusting manprg's planned-rate estimate.
# Guard rails (short elapsed, <2% done, garbage start, rate far off the
# capabilities_rates.csv catalog rate, end in the past) fall back to the
# manprg estimate with a warning. false = exact legacy behaviour.
reforecast_running_mo_ends = true

[cip]
interval_h = 120
duration_h = 6

[objective]
makespan_weight = 6
changeover_weight = 120
cip_defer_weight = 5
# Soft due-date penalty per hour an order finishes late (relax ladder level 2+).
late_weight = 200
# Cross-week mode ([scheduler] cross_week = true, or --cross-week): cost per
# hour an order runs outside the week AZAP asked for. AZAP's week becomes a
# weighted preference over the full 336h horizon instead of a hard wall, so
# a week-1 SKU can merge into a week-0 campaign when that saves a changeover.
# Lower = more willing to move. Total demand stays hard either way.
# Ignored entirely when cross-week mode is off.
week_deviation_weight = 40
# CIP timing flexibility ([scheduler] cip_flex = true, or --cip-flex):
# percentage the cip_defer reward is scaled to, so the solver can pull a CIP
# EARLIER to absorb a changeover instead of always parking it at the last
# legal hour. 100 = unchanged, 0 = no deferral pressure. The line's maximum
# allowable CIP interval (data/reference/line_cip_hrs.csv) is ALWAYS HARD and
# is never affected by this. Ignored when cip_flex is off.
cip_flex_weight = 20
co_conv_org_weight = 30
co_cinn_weight = 20
co_flavor_weight = 5

[changeover]
base_changeover_weight = 5
topload_weight = 50
ttp_weight = 5
ffs_weight = 75
casepacker_weight = 20
conv_org_weight = 30
cinn_weight = 20
flavor_weight = 5
# cip_req_after pairs (changeovers.csv, 2026-08-26): a CIP is REQUIRED
# between these SKUs. This is the solver's soft-violation price — sized to
# dominate all other changeover weights combined; the full pair cost is
# waived when the transition sits at a committed CIP window.
cip_req_weight = 2000

# Draft v0 scorecard formulas — tune with the plant; shown in the UI.
[scorecard]
short_run_h = 4.0
align_tolerance_h = 2.0
at_risk_h = 24.0
default_co_hours_recipe = 1.0
default_co_hours_format = 2.0
default_co_hours_base = 0.5
cip_interval_fallback_h = 120
weight_service = 0.30
weight_changeovers = 0.20
weight_cip = 0.15
weight_campaigns = 0.15
weight_trials = 0.10
cap_recipe_changes = 40
cap_format_changes = 40
cap_co_hours = 80
# Severity-weighted changeovers: FFS & topload worst, casepacker next,
# TTP least, recipe-only cheapest. Scored metric = sum(weight x count).
co_weight_topload = 3.0
co_weight_ffs = 3.0
co_weight_casepacker = 2.0
co_weight_ttp = 1.0
co_weight_recipe_only = 1.0
cap_weighted_co = 150.0
# Per-ISO-week changeover scoring: cap_weighted_co is a ONE-WEEK
# calibration — a 3-week horizon's totals saturated the caps (112 recipe
# changes vs cap 40 read as score 0). Each production week now scores
# weighted_co against its pro-rated cap (span/168h), is floored at
# co_week_score_floor, and weeks combine as a geometric product weighted
# co_week_decay^i (W+0 heaviest; one blown week can't be averaged away).
# total_co_hours (setup_hours-priced) is REPORTED but NOT scored — the
# standards in changeovers.csv aren't trusted yet (2026-08-25);
# cap_co_hours is retained only for display alongside the reported number.
co_week_decay = 0.6
co_week_score_floor = 0.05
cap_cip_hours = 120
# Forfeited CIP hours cap. Retained only for the reported (unscored)
# cip_forfeited_h metric - the SCORED metric is cip_forfeited_kg below.
cap_cip_forfeited = 200
# Forfeited CIP expressed as KILOGRAMS of lost production: for each CIP,
# max(0, interval_h - run_h_since_last_cip) x that line's average kg/h from
# data/reference/capabilities_rates.csv. The seed schedule is ~9.5e5 kg, so this
# cap (~1.6x baseline) leaves the score in a live, non-saturated band.
cap_cip_forfeited_kg = 1500000.0
cap_trial_hours = 48
cap_trial_disruptions = 20
cap_short_runs = 30
cap_orders_late = 15
cap_orders_at_risk = 20
cap_excess_kg = 50000.0
# DEPRECATED / UNUSED: drove the old symmetric run-length score (long runs were
# penalised as hard as short ones). Left in place so nothing referencing it breaks.
target_avg_run_h = 16.0
# Average production run length (h) at which the campaigns run-length sub-metric
# scores 100. Monotonic: score = clamp(100 * avg_run_h / floor, 0, 100), so only
# SHORT runs are penalised and long campaigns are never punished.
campaign_run_floor_h = 24.0
